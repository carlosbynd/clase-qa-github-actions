name: Pruebas automáticas de reservas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comprobar-reservas:
    name: Ejecutar pytest
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v6

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar las dependencias
        run: python -m pip install -r requirements.txt

      - name: Ejecutar las ocho pruebas
        run: python -m pytest -q --junitxml=informes/resultados.xml

      - name: Guardar el informe de pruebas
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: informe-pytest
          path: informes/resultados.xml
          if-no-files-found: warn
          retention-days: 7
